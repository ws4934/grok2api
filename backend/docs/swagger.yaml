      summary: 取消 Response
      tags:
      - Responses
  /v1/responses/compact:
    post:
      consumes:
      - application/json
      parameters:
      - description: 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.SwaggerResponsesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 压缩 Response 上下文
      tags:
      - Responses
  /v1/stt:
    get:
      description: 需要 WebSocket Upgrade，普通请求返回 405；升级后在客户端与上游语音 WebSocket 之间双向转发消息。model
        缺省为 grok-stt。
      parameters:
      - default: grok-stt
        description: 模型
        in: query
        name: model
        type: string
      responses:
        "101":
          description: 切换到 WebSocket
        "405":
          description: Method Not Allowed
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 流式转写（WebSocket）
      tags:
      - Audio
    post:
      consumes:
      - multipart/form-data
      - application/json
      description: |-
        原生 Console 兼容接口：接受 multipart/form-data，或字段同名的 application/json（用 url 代替 file）；file 与 url 提供其一。model 缺省为 grok-stt。
        返回上游原始 JSON，或 text、language、duration 与可选 words（text、start、end、speaker）、channels（index、text、words）。
        ChatGPT 模型 chatgpt-transcribe：只接受上传的 file（不超过 25 MB，不支持 url），只返回文本（无 words、language、duration）。
      parameters:
      - description: 音频文件
        in: formData
        name: file
        type: file
      - description: 音频 URL
        in: formData
        name: url
        type: string
      - default: grok-stt
        description: 模型
        in: formData
        name: model
        type: string
      - description: 语言
        in: formData
        name: language
        type: string
      - description: 音频格式
        in: formData
        name: audio_format
        type: string
      - description: 采样率；也接受 sample_rate_hertz
        in: formData
        name: sample_rate
        type: string
      - description: 透传 Console STT 的 format
        in: formData
        name: format
        type: boolean
      - description: 多声道
        in: formData
        name: multichannel
        type: boolean
      - description: 声道数
        in: formData
        name: channels
        type: integer
      - description: 说话人分离
        in: formData
        name: diarize
        type: boolean
      - description: 保留语气词
        in: formData
        name: filler_words
        type: boolean
      - collectionFormat: multi
        description: 关键词，可重复
        in: formData
        items:
          type: string
        name: keyterm
        type: array
      - description: VAD 阈值
        in: formData
        name: vad_threshold
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "415":
          description: Unsupported Media Type
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 转写音频
      tags:
      - Audio
  /v1/tts:
    post:
      consumes:
      - application/json
      description: |-
        原生 Console 兼容接口：text 与 language 必填，model 缺省为 grok-voice-latest；speed 取值 0.25 到 4.0；optimize_streaming_latency 取值 0 到 4。默认直接返回音频；with_timestamps=true 或上游返回 JSON 封装时返回 JSON：audio（Base64）、content_type、duration，可选 audio_timestamps。
        ChatGPT 模型 chatgpt-tts：output_format.codec 缺省为 mp3，仅支持 mp3、aac、opus；text 不超过 4096 字符；language 仍需传但会被忽略，speed 也被忽略；voice_id 的匹配规则同 POST /v1/audio/speech。
      parameters:
      - description: 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.SwaggerTTSRequest'
      produces:
      - audio/mpeg
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "415":
          description: Unsupported Media Type
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 合成语音
      tags:
      - Audio
  /v1/tts/voices:
    get:
      description: 返回 voices 数组，每项含 voice_id、name、language（可能为 null）。model=chatgpt-tts
        时列出 ChatGPT 账号的音色。
      parameters:
