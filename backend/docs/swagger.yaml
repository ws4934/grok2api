basePath: /
definitions:
  httpserver.SwaggerChatRequest:
    properties:
      messages:
        items:
          $ref: '#/definitions/httpserver.SwaggerMessage'
        type: array
      model:
        example: grok-chat-fast
        type: string
      stream:
        example: false
        type: boolean
    type: object
  httpserver.SwaggerImageEditRequest:
    properties:
      aspect_ratio:
        example: "1:1"
        type: string
      background:
        example: auto
        type: string
      image:
        $ref: '#/definitions/httpserver.SwaggerImageReference'
      images:
        items:
          $ref: '#/definitions/httpserver.SwaggerImageReference'
        type: array
      mask:
        $ref: '#/definitions/httpserver.SwaggerImageReference'
      model:
        example: grok-imagine-image-edit
        type: string
      "n":
        example: 1
        type: integer
      output_format:
        example: png
        type: string
      partial_images:
        example: 0
        type: integer
      prompt:
        example: Change the background to black
        type: string
      quality:
        example: medium
        type: string
      resolution:
        example: 1k
        type: string
      response_format:
        example: url
        type: string
      size:
        example: 1024x1024
        type: string
      stream:
        example: false
        type: boolean
    type: object
  httpserver.SwaggerImageGenerationRequest:
    properties:
      aspect_ratio:
        example: "16:9"
        type: string
      background:
        example: auto
        type: string
      model:
        example: grok-imagine-image-quality
        type: string
      "n":
        example: 1
        type: integer
      output_format:
        example: png
        type: string
      partial_images:
        example: 0
        type: integer
      prompt:
        example: A cinematic city at night
        type: string
      quality:
        example: medium
        type: string
      resolution:
        example: 2k
        type: string
      response_format:
        example: url
        type: string
      size:
        example: 1024x1024
        type: string
      stream:
        example: false
        type: boolean
    type: object
  httpserver.SwaggerImageReference:
    properties:
      b64_json:
        type: string
      image_url:
        type: string
      url:
        example: https://example.com/source.png
        type: string
    type: object
  httpserver.SwaggerMessage:
    properties:
      content: {}
      role:
        example: user
        type: string
    type: object
  httpserver.SwaggerMessagesRequest:
    properties:
      max_tokens:
        example: 1024
        type: integer
      messages:
        items:
          $ref: '#/definitions/httpserver.SwaggerMessage'
        type: array
      model:
        example: grok-chat-expert
        type: string
      stream:
        example: false
        type: boolean
    type: object
  httpserver.SwaggerResponsesRequest:
    properties:
      background:
        type: boolean
      input: {}
      model:
        example: grok-chat-auto
        type: string
      previous_response_id:
        type: string
      prompt_cache_key:
        type: string
      store:
        example: false
        type: boolean
      stream:
        example: false
        type: boolean
      tools:
        description: Tools may carry one image_generation tool; Background then returns
          immediately.
        items: {}
        type: array
    type: object
  httpserver.SwaggerSpeechRequest:
    properties:
      input:
        example: Hello from the gateway
        type: string
      language:
        example: en
        type: string
      model:
        example: grok-voice-latest
        type: string
      optimize_streaming_latency:
        example: 0
        type: integer
      output_format:
        $ref: '#/definitions/httpserver.SwaggerTTSOutputFormat'
      response_format:
        example: mp3
        type: string
      speed:
        example: 1
        type: number
      text_normalization:
        example: false
        type: boolean
      voice:
        example: alloy
        type: string
      voice_id:
        example: eve
        type: string
      with_timestamps:
        example: false
        type: boolean
    type: object
  httpserver.SwaggerTTSOutputFormat:
    properties:
      bit_rate:
        example: 128000
        type: integer
      codec:
        example: mp3
        type: string
      sample_rate:
        example: 24000
        type: integer
    type: object
  httpserver.SwaggerTTSRequest:
    properties:
      language:
        example: en
        type: string
      model:
        example: grok-voice-latest
        type: string
      optimize_streaming_latency:
        example: 0
        type: integer
      output_format:
        $ref: '#/definitions/httpserver.SwaggerTTSOutputFormat'
      speed:
        example: 1
        type: number
      text:
        example: Hello from the gateway
        type: string
      text_normalization:
        example: false
        type: boolean
      voice_id:
        example: eve
        type: string
      with_timestamps:
        example: false
        type: boolean
    type: object
  httpserver.SwaggerVideoAudioInput:
    properties:
      voice_id:
        example: eve
        type: string
    type: object
  httpserver.SwaggerVideoGenerationRequest:
    properties:
      aspect_ratio:
        example: "16:9"
        type: string
      duration:
        example: 8
        type: integer
      image:
        $ref: '#/definitions/httpserver.SwaggerVideoMediaInput'
      last_frame:
        $ref: '#/definitions/httpserver.SwaggerVideoMediaInput'
      model:
        example: grok-imagine-video
        type: string
      prompt:
        example: A cinematic tracking shot in the rain
        type: string
      reference_audios:
        items:
          $ref: '#/definitions/httpserver.SwaggerVideoAudioInput'
        type: array
      reference_images:
        description: 'Reference images: Console 1.5 accepts 14 alongside image; classic
          Console accepts 7, Build 8, both exclusive with image. Extra inputs are
          trimmed.'
        items:
          $ref: '#/definitions/httpserver.SwaggerVideoMediaInput'
        type: array
      reference_videos:
        items:
          $ref: '#/definitions/httpserver.SwaggerVideoMediaInput'
        type: array
      resolution:
        example: 720p
        type: string
      video:
        $ref: '#/definitions/httpserver.SwaggerVideoMediaInput'
    type: object
  httpserver.SwaggerVideoMediaInput:
    properties:
      file_id:
        example: file_123
        type: string
      url:
        example: https://example.com/input.png
        type: string
    type: object
info:
  contact: {}
  description: Grok Build 与 Grok Web 多账号 API 网关。
  title: Grok2API
  version: "1.0"
paths:
  /api/admin/v1/system/update/apply:
    post:
      description: |-
        需要管理端登录会话。下载 GitHub Release 中当前平台的 grok2api_<tag>_<os>_<arch>.tar.gz，按 checksums.txt 校验 SHA-256 后替换可执行文件、前端静态目录与 VERSION，原文件保留为 <路径>.backup。
        仅在 GET /api/admin/v1/system/version 返回 canUpdate=true 时可用；同一时间只允许一个更新或回滚。返回 data.version 为新版本；data.restarting=true 表示受 Docker 或 systemd 托管、服务即将自动重启，否则需手动重启。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 没有新版本、当前安装不支持在线更新或已有操作进行中
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 在线更新到最新版本
      tags:
      - System
  /api/admin/v1/system/update/rollback:
    post:
      description: 需要管理端登录会话。用上次更新留下的 .backup 换回可执行文件、前端静态目录与 VERSION，响应与在线更新相同（data.version
        为回滚后的版本）。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 没有可回滚的备份或已有操作进行中
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 回滚上次在线更新
      tags:
      - System
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: 存活检查
      tags:
      - System
  /readyz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: 就绪检查
      tags:
      - System
  /v1/audio/speech:
    post:
      consumes:
      - application/json
      description: |-
        默认直接返回音频；with_timestamps=true 或上游返回 JSON 封装时返回 JSON：audio（Base64）、content_type、duration，可选 audio_timestamps（graph_chars、graph_times）。
        model 缺省为 grok-voice-latest，language 缺省为 en；response_format 支持 mp3、opus（ogg）、aac、flac、wav、pcm，缺省为 mp3，output_format.codec 优先；speed 取值 0.25 到 4.0；optimize_streaming_latency 取值 0 到 4；voice_id 优先于 voice，OpenAI 音色名映射为 Grok 音色（alloy/verse→ara、echo/ballad→eve、fable/coral→sal、onyx/ash→rex、nova/sage→leo、shimmer/marin→sia），其余值原样透传。
        ChatGPT 模型 chatgpt-tts：response_format 仅支持 mp3、aac、opus（wav、flac、pcm 返回 400）；input 不超过 4096 字符；忽略 speed 与 language；voice 按账号音色 ID 或显示名匹配（breeze、cove、glimmer（显示名 Sol）、orbit（显示名 Spruce）、maple、juniper、ember、vale、fathom（显示名 Arbor）），未知名称（如 OpenAI 的 alloy）使用账号当前选中的音色；单次合成约 9 秒。
      parameters:
      - description: 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.SwaggerSpeechRequest'
      produces:
      - audio/mpeg
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "415":
          description: Unsupported Media Type
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 合成语音（OpenAI 兼容）
      tags:
      - Audio
  /v1/audio/tasks:
    post:
      consumes:
      - application/json
      description: 行为与参数同 POST /v1/audio/speech（含 ChatGPT chatgpt-tts 的限制）：默认直接返回音频，with_timestamps=true
        时返回 JSON。
      parameters:
      - description: 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.SwaggerSpeechRequest'
      produces:
      - audio/mpeg
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "415":
          description: Unsupported Media Type
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 合成语音（/v1/audio/speech 兼容别名）
      tags:
      - Audio
  /v1/audio/transcriptions:
    post:
      consumes:
      - multipart/form-data
      - application/json
      description: |-
        接受 multipart/form-data，或字段同名的 application/json（用 url 代替 file）；file 与 url 提供其一。model 缺省为 grok-stt。
        response_format：json（缺省）返回 text；text 返回纯文本；verbose_json 返回 task、text、language、duration 与 words（word、start、end、可选 speaker）。传 prompt、非 0 的 temperature 或 timestamp_granularities 返回 400。其余 Console 扩展字段同 POST /v1/stt。
        ChatGPT 模型 chatgpt-transcribe：只接受上传的 file（不超过 25 MB，不支持 url），只返回文本（无 words、language、duration）。
      parameters:
      - description: 音频文件
        in: formData
        name: file
        type: file
      - description: 音频 URL
        in: formData
        name: url
        type: string
      - default: grok-stt
        description: 模型
        in: formData
        name: model
        type: string
      - description: 语言
        in: formData
        name: language
        type: string
      - default: json
        description: 响应格式
        enum:
        - json
        - text
        - verbose_json
        in: formData
        name: response_format
        type: string
      produces:
      - application/json
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "415":
          description: Unsupported Media Type
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 转写音频（OpenAI 兼容）
      tags:
      - Audio
  /v1/chat/completions:
    post:
      consumes:
      - application/json
      description: |-
        支持 JSON 与 SSE、图片输入和函数工具。
        ChatGPT 文本模型（账号模型同步，如 auto、gpt-6、gpt-6-mini、gpt-5-3-mini）：usage 为本地 o200k_base 估算（上游不返回用量）；不支持的采样参数被忽略；reasoning_effort 映射为上游推理强度；回复为纯 Markdown（网关要求 ChatGPT 不输出网页 UI 组件）。
        ChatGPT 函数工具：通过提示词与 XML 调用约定模拟，返回 tool_calls 且 finish_reason 为 tool_calls；只解析已声明的函数名；支持 tool_choice 的 none、required 与指定函数，parallel_tool_calls=false 时只保留第一个调用；最多 128 个工具，每个 description 不超过 16 KB；不模拟 custom 自由格式工具；能否产生调用取决于模型是否遵循约定格式。
        ChatGPT 联网搜索：web_search_options 由 ChatGPT 在服务端搜索，引用以 url_citation 写入 annotations；实时类问题即使未开启搜索也可能触发 ChatGPT 自动搜索。
      parameters:
      - description: 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.SwaggerChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建 Chat Completion
      tags:
      - Chat
  /v1/images/edits:
    post:
      consumes:
      - application/json
      - multipart/form-data
      description: ChatGPT 图片模型：gpt-image-2、gpt-image-2.5、gpt-image-2.5-flare、gpt-image-2.5-sunburst。
      parameters:
      - description: 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.SwaggerImageEditRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 编辑图片
      tags:
      - Images
  /v1/images/generations:
    post:
      consumes:
      - application/json
      description: ChatGPT 图片模型：gpt-image-2、gpt-image-2.5、gpt-image-2.5-flare、gpt-image-2.5-sunburst。
      parameters:
      - description: 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.SwaggerImageGenerationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 生成图片
      tags:
      - Images
  /v1/media/images/{asset_id}:
    get:
      parameters:
      - description: Asset ID
        in: path
        name: asset_id
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
      summary: 获取归档图片
      tags:
      - Images
  /v1/messages:
    post:
      consumes:
      - application/json
      description: |-
        ChatGPT 文本模型（账号模型同步，如 auto、gpt-6、gpt-6-mini、gpt-5-3-mini）：usage 为本地 o200k_base 估算（上游不返回用量）；不支持的采样参数被忽略；回复为纯 Markdown（网关要求 ChatGPT 不输出网页 UI 组件）。
        ChatGPT 函数工具：通过提示词与 XML 调用约定模拟，返回 tool_use 块；只解析已声明的函数名；支持 tool_choice 的 none、required 与指定函数，parallel_tool_calls=false 时只保留第一个调用；最多 128 个工具，每个 description 不超过 16 KB；不模拟 custom 自由格式工具；能否产生调用取决于模型是否遵循约定格式。
        ChatGPT 联网搜索：web_search_* 工具由 ChatGPT 在服务端搜索，结果为 server_tool_use 与 web_search_tool_result 块；支持用 tool_choice 强制搜索；实时类问题即使未声明工具也可能触发 ChatGPT 自动搜索。
      parameters:
      - default: "2023-06-01"
        description: Anthropic API version
        in: header
        name: anthropic-version
        required: true
        type: string
      - description: 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.SwaggerMessagesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建 Anthropic Message
      tags:
      - Messages
  /v1/models:
    get:
      description: ChatGPT 账号的模型：文本模型来自账号模型同步（如 auto、gpt-6、gpt-6-mini、gpt-5-3-mini）；图片模型
        gpt-image-2、gpt-image-2.5、gpt-image-2.5-flare、gpt-image-2.5-sunburst；语音模型
        chatgpt-tts、chatgpt-transcribe。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取可用模型
      tags:
      - Models
  /v1/realtime:
    get:
      description: 需要 WebSocket Upgrade，普通请求返回 400；升级后在客户端与上游语音 WebSocket 之间双向转发消息。model
        缺省为 grok-voice-latest。
      parameters:
      - default: grok-voice-latest
        description: 模型
        in: query
        name: model
        type: string
      responses:
        "101":
          description: 切换到 WebSocket
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 实时语音（WebSocket）
      tags:
      - Audio
  /v1/responses:
    post:
      consumes:
      - application/json
      description: |-
        支持 JSON 与 SSE；stream=true 时返回 text/event-stream。
        携带 image_generation 工具且图片路由支持可恢复图片任务（如 ChatGPT）时按图片任务执行：默认等待并返回含 image_generation_call 的 Response；background=true 立即返回 queued 对象，用 GET /v1/responses/{response_id} 查询、POST /v1/responses/{response_id}/cancel 取消。工具未指定 model 且顶层模型为该 Provider 的文本模型时使用运行时设置 providerChatGPT.defaultImageModel。
        ChatGPT 文本模型（账号模型同步，如 auto、gpt-6、gpt-6-mini、gpt-5-3-mini）：usage 为本地 o200k_base 估算（上游不返回用量）；不支持的采样参数被忽略；reasoning.effort 映射为上游推理强度；回复为纯 Markdown（网关要求 ChatGPT 不输出网页 UI 组件）。
        ChatGPT 函数工具：通过提示词与 XML 调用约定模拟，返回 function_call 项；只解析已声明的函数名；支持 tool_choice 的 none、required 与指定函数，parallel_tool_calls=false 时只保留第一个调用；最多 128 个工具，每个 description 不超过 16 KB；不模拟 custom 自由格式工具；能否产生调用取决于模型是否遵循约定格式。
        ChatGPT 联网搜索：web_search / web_search_preview 工具由 ChatGPT 在服务端搜索，结果为 web_search_call 项加 url_citation 注释；支持用 tool_choice 强制搜索；实时类问题即使未声明工具也可能触发 ChatGPT 自动搜索。
      parameters:
      - description: 图片任务幂等键：相同请求返回同一任务，请求体不同返回 409
        in: header
        name: Idempotency-Key
        type: string
      - description: 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.SwaggerResponsesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建 Response
      tags:
      - Responses
  /v1/responses/{response_id}:
    delete:
      parameters:
      - description: Response ID
        in: path
        name: response_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除 Response
      tags:
      - Responses
    get:
      description: resp_img_ 前缀的 ID 为图片任务，返回其当前状态与已生成的图片。
      parameters:
      - description: Response ID
        in: path
        name: response_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 查询 Response
      tags:
      - Responses
  /v1/responses/{response_id}/cancel:
    post:
      description: 仅图片任务可取消，且其图片尚未提交上游；已结束的任务原样返回。
      parameters:
      - description: Response ID
        in: path
        name: response_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
